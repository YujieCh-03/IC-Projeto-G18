<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/saude.css">
    <link rel="stylesheet" href="../css/socorro.css">
    <script src="../js/saude.js" defer></script>
    <script src="../js/socorro.js" defer></script>
</head>
<body>
    <main class="tlm saude">
        <a class="saude-voltar" href="festivalhome.html"
           aria-label="Voltar ao mapa">voltar</a>
           <a id="estado-socorro" href="#socorro-enviado" hidden>Socorro</a>

        <h1>Corpo</h1>

        <div class="saude-dados">
            <p>Ritmo cardíaco: <span id="ritmo-cardiaco">70</span> bpm</p>
            <p>Glicemia: 90 mg/dL</p>
            <p>Taxa de álcool: 0,0 g/L</p>
            <p>Saturação de oxigénio: 98%</p>
        </div>
        <a class="primario saude-socorro" href="#pedir-socorro">
    Primeiros socorros
         </a>
    </main>
    <div class="pop" id="pedir-socorro">
    <div class="popup-caixa">
        <h2>Primeiros socorros</h2>
        <p>Precisa de assistência?</p>

        <div class="respostas">
            <a class="primario" href="#socorro-enviado">
                Pedir ajuda
            </a>
            <a class="secundario" href="#">
                Cancelar
            </a>
        </div>
    </div>
</div>

<div id="socorro-enviado" class="pop" hidden>
    <div class="popup-caixa" role="dialog" aria-labelledby="titulo-socorro">
        <h2 id="titulo-socorro">Pedido de socorro</h2>
        <p>A equipa de primeiros socorros está a caminho.</p>

        <div class="respostas">
            <button type="button" id="fechar-socorro" class="secundario">
                Fechar
            </button>
            <button type="button" id="cancelar-socorro">Cancelar pedido</button>
        </div>
    </div>
</div>
</body>
</html>
