<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/saude.css">
</head>
<body>
    <main class="tlm saude">
        <a class="saude-voltar" href="festivalhome.html"
           aria-label="Voltar ao mapa">voltar</a>

        <h1>Corpo</h1>

        <div class="saude-dados">
            <p>Ritmo cardíaco: 84 bpm</p>
            <p>Glicemia: 90 mg/dL</p>
            <p>Taxa de álcool: 0,0 g/L</p>
            <p>Saturação de oxigénio: 98%</p>
        </div>
        <a class="primario saude-socorro" href="#pedir-socorro">
    Primeiros socorros
         </a>
    </main>
    <div class="pop" id="pedir-socorro">
    <div class="popup-caixa">
        <h2>Primeiros socorros</h2>
        <p>Precisa de assistência?</p>

        <div class="respostas">
            <a class="primario" href="#socorro-enviado">
                Pedir ajuda
            </a>
            <a class="secundario" href="#">
                Cancelar
            </a>
        </div>
    </div>
</div>

<div class="pop" id="socorro-enviado">
    <div class="popup-caixa">
        <h2>Pedido enviado</h2>
        <p>A equipa de socorro está a caminho do seu local.</p>
        <p><small>Simulação do protótipo.</small></p>
        <a class="primario" href="#">OK</a>
    </div>
</div>
</body>
</html>
