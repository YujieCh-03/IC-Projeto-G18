<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horário dos concertos</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/horario_concertos.css">
</head>
<body>
    <main class="tlm horario">
        <a class="horario-voltar" href="festivalhome.html"
           aria-label="Voltar ao mapa">←</a>

        <h1>Horário</h1>

        <table class="horario-tabela">
            <thead>
                <tr>
                    <th scope="col">Banda</th>
                    <th scope="col">Hora</th>
                    <th scope="col">Palco</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>XXX</td>
                    <td>18:00 – 19:00</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>ZZZ</td>
                    <td>19:30 – 20:30</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>AAA</td>
                    <td>21:00 – 22:00</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>FFF</td>
                    <td>22:30 – 23:30</td>
                    <td>3</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
