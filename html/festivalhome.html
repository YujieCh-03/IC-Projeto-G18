<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BandyApp</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/mapa.css">
    <script src="../js/escolherFestival.js" defer></script>
</head>
<body>
    <main class="tlm festival">
     <a class="sair" href="main.html"
   aria-label="Voltar ao menu principal">Sair</a>

<div class="mapa-area" id="mapa">
    <img class="mapa" src="../files/mapa.png"
         alt="Mapa do recinto do festival">

    <a class="mapa-ponto palco1"
       href="horario_concertos.html"
       aria-label="Ver horários do Palco 1"></a>

    <a class="mapa-ponto palco2"
       href="horario_concertos.html"
       aria-label="Ver horários do Palco 2"></a>

    <a class="mapa-ponto palco3"
       href="horario_concertos.html"
       aria-label="Ver horários do Palco 3"></a>

    <a class="mapa-ponto restaurante1"
       href="pag_bar.html?bar=Bar do Zé"
       aria-label="Encomendar comida no Bar do Zé"></a>

    <a class="mapa-ponto restaurante2"
       href="pag_bar.html?bar=Copo Meio Cheio"
       aria-label="Encomendar comida no Copo Meio Cheio"></a>

    <a class="mapa-ponto restaurante3"
       href="pag_bar.html?bar=Cantina"
       aria-label="Encomendar comida na Cantina"></a>

    <a class="mapa-ponto wc1"
       href="#estado-wc"
       aria-label="Ver ocupação do WC 1"></a>

    <a class="mapa-ponto wc2"
       href="#estado-wc"
       aria-label="Ver ocupação do WC 2"></a>

    <a class="mapa-ponto wc3"
       href="#estado-wc"
       aria-label="Ver ocupação do WC 3"></a>

    <a class="mapa-ponto socorros"
       href="#pedir-socorro"
       aria-label="Pedir primeiros socorros"></a>
<div class="minha-posicao" role="img" aria-label="Está aqui">
    <span>Está aqui</span>
</div>
</div>

        <nav class="botoes" aria-label="Menu do festival">
            <a href="horario_concertos.html">Horários</a>
            <a href="pag_restaurantes.html">Encomendar comida</a>
            <a href="amigos.html">Amizade</a>
            <a href="saude.html">Saúde</a>
        </nav>
    </main>
    <div class="pop mapa-popup" id="estado-wc">
    <div class="popup-caixa">
        <h2>Ocupação do WC</h2>
        <p>Este WC tem poucas pessoas neste momento.</p>
        <a class="secundario" href="#mapa">Fechar</a>
    </div>
</div>

<div class="pop mapa-popup" id="pedir-socorro">
    <div class="popup-caixa">
        <h2>Primeiros socorros</h2>
        <p>Precisa de assistência?</p>

        <div class="respostas">
            <a class="primario" href="#socorro-enviado">
                Pedir ajuda
            </a>
            <a class="secundario" href="#mapa">
                Cancelar
            </a>
        </div>
    </div>
</div>

<div class="pop mapa-popup" id="socorro-enviado">
    <div class="popup-caixa">
        <h2>Pedido enviado</h2>
        <p>A equipa de socorro está a caminho do seu local.</p>
        <p><small>Simulação do protótipo.</small></p>
        <a class="primario" href="#mapa">OK</a>
    </div>
</div>
</body>
</html>
