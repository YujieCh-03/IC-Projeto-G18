<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>BandyApp</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/mbway.css">
    <meta name="viewport"
    content="width=device-width,initial-scale=1.0">
    <script src="../js/compras.js" defer></script>
    <script src="../js/pagamento.js" defer></script>
</head>
<body>
    <div class="tlm">
        <a href="choice.html" class="voltar-btn" id="voltar-pagamento">voltar</a>

        <h1>MB WAY</h1>
        <div class="resumo"></div>

        <form class="mbway" id="form-pagamento" data-metodo="MB WAY">
            <label class="codigo_pais" for="codigo-pais">Código do país</label>
            <br>
            <select class="selectMBWay" id="codigo-pais">
                <option>+351</option>
                <option>+86</option>
            </select>
            <br>
            <label class="numero_telemovel" for="telemovel">Número de telemóvel</label>
            <br>
            <input class="inputMBWay" id="telemovel" type="tel" inputmode="numeric" placeholder="912345678" maxlength="9" required>
            <br>
            <button class="btn-mbway" type="submit">Continuar</button>
        </form>

        <div id="confirmacao" class="pop" style="display: none">
            <div class="popup-caixa">
                <h2>Tem a certeza que deseja pagar?</h2>
                <div class="resumo"></div>
                <p id="erro-pagamento" role="alert" hidden></p>
                <button class="primario" type="button" id="confirmar-pagamento">Confirmar</button>
                <a class="secundario" href="#">Cancelar</a>
            </div>
        </div>

        <div id="sucesso" class="pop" style="display: none">
            <div class="popup-caixa">
                <h2>Pagamento com sucesso!</h2>
                <a class="primario" href="recibo.html" id="ver-recibo">Ver recibo</a>
                <a class="secundario" href="bilhetes.html" id="destino-pagamento">Ver bilhetes</a>
            </div>
        </div>
    </div>
</body>
</html>
