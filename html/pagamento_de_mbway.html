<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>BandyApp</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <meta name="viewport"
    content="width=device-width,initial-scale=1.0">
</head>
<body>
    <div class="tlm">
        <a href="./choice.html" class="voltar-btn">voltar</a>

        <h1>MBway</h1>

        <div class="mbway">
            <label class="codigo_pais">Código do país</label>
            <br>
            <select class="selectMBWay">
                <option>+351</option>
            </select>
            <br>
            <label class="numero_telemovel">Número de telemóvel</label>
            <br>
            <input class="inputMBWay" type="tel" placeholder="912345678">
            <br>
            <a href="#sucesso" class="btn-mbway">continuar</a>
        </div>
        <div id="sucesso" class="pop">
            <div class="popup-caixa">
                <h2>Pagamento com sucesso!</h2>
                <a class="primario" href="recibo.html">Ver recibo</a>
                <a class="secundario" href="#">Fechar</a>
            </div>
        </div>
    </div>
</body>
</html>
