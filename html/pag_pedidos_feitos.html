<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>BandyApp</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pag_pedidos_feitos.css">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script src="../js/compras.js" defer></script>
    <script src="../js/pedidosFeitos.js" defer></script>
</head>
<body>
    <div class="tlm">
        <a href="./pag_restaurantes.html" class="voltar-btn">voltar</a>

        <h2>Os meus pedidos</h2>

        <div class="pedidos-list" id="pag_pedidos">
            <div id="sem-pedidos" hidden>
                <a class="primario" href="pag_restaurantes.html">Fazer Pedido</a>
            </div>
        </div>

        <div id="qrcode_pedido" class="pop">
            <div class="popup-caixa">
                <img class="qrcode_pedido" src="../files/qrcode.png">
                <a class="secundario" href="#">Fechar</a>
            </div>
        </div>

        <div id="repetir_pedido" class="pop">
            <div class="popup-caixa">
                <p>Deseja repetir este pedido?</p>
                <div class="respostas">
                    <a class="primario" id="repetir-btn" href="choice2.html">Sim</a>
                    <a class="secundario" href="#" id="apagar_conf">Não</a>
                </div>
            </div>
        </div>
        
        <div id="apagar_pedido" class="pop">
            <div class="popup-caixa">
                <p>Tem a certeza que quer apagar este pedido?</p>
                <a class="secundario" href="#recibo_pedido-pdf">Guardar Recibo Antes</a>
                <div class="respostas">
                    <a class="primario" href="#">Não Apagar!</a>
                    <a class="secundario" href="#" id="apagar_conf">Apagar</a>
                </div>
            </div>
        </div>

        <div id="recibo_pedido-pdf" class="pop">
            <div class="popup-caixa">
                <h2>Com que nome deseja guardar o recibo?</h2>
                <input type="text" placeholder="nome_pedido.pdf" class="nome_pedido_input">
                <div class="respostas">
                    <a class="primario" href="#">Confirmar</a>
                    <a class="secundario" href="#">Fechar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
