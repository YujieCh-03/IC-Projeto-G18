<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento com Cartão</title>
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/global.css">
    <script src="../js/compras.js" defer></script>
    <script src="../js/pagamento.js" defer></script>
    <script src="../js/card.js" defer></script>
</head>
<body>
    <div class="tlm">
        <main class="all">
            <a href="choice.html" class="voltar-btn" id="voltar-pagamento">voltar</a>

            <h1>Pagamento com Cartão</h1>
            <div class="resumo"></div>

            <form class="form" id="form-pagamento" data-metodo="Cartão bancário">
                <label for="name">Nome no cartão</label>
                <input id="name" type="text" placeholder="Nome completo" maxlength="70" required>

                <label for="number">Número do cartão</label>
                <input id="number" type="text" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19" required>

                <div class="row">
                    <div>
                        <label for="expiry">Validade</label>
                        <input id="expiry" type="text" inputmode="numeric" placeholder="MM/AA" maxlength="5"  required>
                    </div>
                    <div>
                        <label for="cvv">CVV</label>
                        <input id="cvv" type="password" inputmode="numeric" placeholder="123" maxlength="3"  required>
                    </div>
                </div>

                <button class="confirm" type="submit">Confirmar pagamento</button>
            </form>
        </main>

        <div id="confirmacao" class="pop" style="display: none">
            <div class="popup-box">
                <h2>Tem a certeza que deseja pagar?</h2>
                <div class="resumo"></div>
                <p id="erro-pagamento" role="alert" hidden></p>
                <button class="primario" type="button" id="confirmar-pagamento">Confirmar</button>
                <a class="secundario" href="#">Cancelar</a>
            </div>
        </div>

        <div id="sucesso" class="pop" style="display: none">
            <div class="popup-box">
                <h2>Pagamento com sucesso!</h2>
                <a class="primario" href="recibo.html" id="ver-recibo">Ver recibo</a>
                <a class="secundario" href="bilhetes.html" id="destino-pagamento">Ver bilhetes</a>
            </div>
        </div>
    </div>
</body>
</html>
