<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>BandyApp</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pag_pedido.css">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script src="../js/compras.js" defer></script>
    <script src="../js/bar.js" defer></script>
</head>
<body>
    <div class="tlm">
        <a href="pag_bar.html" class="voltar-btn" id="voltar-bar">voltar</a>

        <h1>Pedido</h1>
        <div class="pedido_feito">
            <p class="bar" id="nome-bar"></p>
            <p id="hora-pedido" hidden></p>
            <div class="itens_pedido">
                <table class="tabela_pedido">
                    <thead>
                        <tr>
                            <th>Item:</th>
                            <th>Quantidade:</th>
                            <th>Preço:</th>
                        </tr>
                    </thead>
                    <tbody id="itens-pedido"></tbody>
                    <tfoot>
                        <tr>
                            <th>Total:</th>
                            <td id="quantidade-pedido"></td>
                            <th id="total-pedido"></th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
        <div>
            <a href="#pagamento" class="btn-pagamento" id="pagar-pedido">Pagamento</a>
        </div>
        <div id="pagamento" class="pop">
            <div class="popup-caixa">
                <h2>Deseja continuar para o pagamento?</h2>
                <div class="respostas_pagar">
                    <a class="primario" href="choice2.html" id="continuar-pedido">Sim</a>
                    <a class="secundario" href="#">Fechar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
