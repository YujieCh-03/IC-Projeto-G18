<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>BandyApp</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <meta name="viewport"
    content="width=device-width,initial-scale=1.0">
</head>
<body>
    <div class="tlm">
        <a href="./pag_bar.html" class="voltar-btn">voltar</a>

        <h1>Pedido</h1>
        <div class="pedido_feito">
            <p class="bar">Copo Meio Cheio</p>
            <div class="itens_pedido">
                <table class="tabela_pedido">
                    <tr>
                        <th>Item:</th>
                        <th>Quantidade:</th>
                        <th>Preço:</th>
                    </tr>
                    <tr>
                        <td>Copo</td>
                        <td>1</td>
                        <td>1€</td>
                    </tr>
                    <tr>
                        <td>Cerveja, 25cl</td>
                        <td>1</td>
                        <td>1€</td>
                    </tr>
                    <tr>
                        <td>Seitana</td>
                        <td>1</td>
                        <td>3€</td>
                    </tr>
                    <tr>
                        <th>Total:</th>
                        <td>3</td>
                        <th>5€</th>
                    </tr>
                </table>
            </div>
        </div>
        <div>
            <a href="#pagamento" class="btn-pagamento">Pagamento</a>
        </div>
        <div id="pagamento" class="pop">
            <div class="popup-caixa">
                <h2>Deseja continuar para o pagamento?</h2>
                <div class="respostas_pagar">
                    <a class="sim_pagar" href="choice2.html">Sim</a>
                    <a class="fechar_pagar" href="#">Fechar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
