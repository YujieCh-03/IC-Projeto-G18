<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>BandyApp - Ver Bilhete</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/verbilhete.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/compras.js" defer></script>
    <script src="../js/bilhetes.js" defer></script>
</head>
<body>
    <main>
        <div class="tlm">
            <a href="bilhetes.html" class="voltar-btn">voltar</a>    
            <div class="ticket-detail-card">
                <h2 id="festival-bilhete"></h2>
                <div class="qr-container">
                    <img src="../files/qrcode.png" alt="Código QR do Bilhete" class="qr-image">
                </div>
                <div class="ticket-info">
                    <div class="info-row">
                        <span class="label">Nº do Bilhete:</span>
                        <span class="value" id="numero-bilhete"></span>
                    </div>
                    <div class="info-row">
                        <span class="label">Tipo:</span>
                        <span class="value" id="tipo-bilhete"></span>
                    </div>
                    <div class="info-row">
                        <span class="label">Data:</span>
                        <span class="value" id="datas-bilhete"></span>
                    </div>
                    <div class="info-row">
                        <span class="label">Portador:</span>
                        <span class="value" id="nome-bilhete"></span>
                    </div>
                </div>
            </div>
            <a class="pdf-btn" href="#nomePDF">Guardar como PDF</a>
            <button class="pdf-btn" type="button" id="remover-bilhete">Remover Bilhete</button>
            <p id="erro-remocao" role="alert" hidden></p>
            <div class="popups">

                <div id="nomePDF" class="popup-pdf">
                    <div class="popup-box-pdf">
                        <h2>Com que nome deve ser guardado o bilhete?</h2>
                        <input type="text" placeholder="nome.pdf" id="input_nome">
                        <br><br>
                        <a class="primario" href="#save-pdf">Confirmar</a>
                        <a class="secundario" href="#">Cancelar</a>
                    </div>
                </div>

                <div id="save-pdf" class="popup-pdf">
                    <div class="popup-box-pdf">
                        <h2>Bilhete guardado com sucesso!</h2>
                        <a class="primario" href="#">OK</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
