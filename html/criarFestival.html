<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>BandyApp</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/criarFestival.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/criarFestival.js" defer></script>
</head>
<body>
    <main>
        <div class="tlm">
            <a href="pag_comprarBilhetes.html" class="voltar-btn">voltar</a>
            <form id="form_festival">
                <p><b>Nome do Festival:</b></p>            
                <input type="text" id="nome_festival" placeholder="Nome do Festival" required minlength="3">
                <br>
                <p>Data do Festival:</p>
                <input type="text" id="datas_festival" placeholder="18, 19 e 20 de Julho 2027" required minlength="3">
                <br>
                <p>Cartaz do Festival:</p>
                <input type="file" accept="image/*" id="cartazNovo" required>
                <br>
                <p>Logo do Festival:</p>
                <input type="file" accept="image/*" id="logoNovo" required>
                <br>
                <button class="guardar-btn" type="submit">Guardar</button>
            </form>
        </div>
    </main>
</body>
</html>
